name: Release to PyPI

on:
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: ./

jobs:
  validate-git-tag:
    name: Validate the git tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Compare release tag with package version
        run: |
          RELEASE_TAG=${GITHUB_REF##*/}
          PACKAGE_VERSION=$( grep version pyproject.toml | head -n 1 | awk '{print $3}' | tr -d '"' )
          if [[ "${RELEASE_TAG}" != "v${PACKAGE_VERSION}" ]]; then
            echo "Package version is ${PACKAGE_VERSION}, but the pushed tag is ${RELEASE_TAG}."
            exit 1
          fi

  build:
    needs: validate-git-tag
    uses: ./.github/workflows/build.yml

  release-pypi-ubuntu:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install twine
        run: pip install twine

      - name: Setup
        run: make init

      - name: Build
        run: uv build

      - name: Publish
        run: twine upload dist/*
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}

  release-documentation:
    needs: release-pypi-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Setup
        run: make init

      - name: Build and Publish Sphinx documentation
        run: |
          echo "Generate the new documentation"
          make build-documentation
          mv docs/build ~/build

          echo "Configure git"
          git config --global user.name 'Github Action'
          git config --global user.email 'fvaleye@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY

          echo "Commit the new changes in the gh-pages"
          git reset --hard HEAD
          git clean -d -fx .
          git fetch
          git checkout gh-pages
          cp -avr ~/build/html/.  ./documentation

          git status
          git add ./documentation
          git commit -m "Publish the new documentation for ${GITHUB_REF_NAME}"
          git push origin gh-pages

  release-docker:
    needs: release-pypi-ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            florianvaleye/tracarbon
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
